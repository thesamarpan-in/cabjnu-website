name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuilds daily so plant data added to the Google Sheet goes live even
  # if nobody pushes code that day. Adjust the schedule if you want faster
  # turnaround, but weigh that against GitHub Actions minutes usage.
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC = 08:30 IST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLANTS_SHEET_CSV_URL: ${{ secrets.PLANTS_SHEET_CSV_URL }}
          NEXT_PUBLIC_QUIZ_RESULTS_ENDPOINT: ${{ secrets.NEXT_PUBLIC_QUIZ_RESULTS_ENDPOINT }}
          NEXT_PUBLIC_COMMENTS_ENDPOINT: ${{ secrets.NEXT_PUBLIC_COMMENTS_ENDPOINT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
